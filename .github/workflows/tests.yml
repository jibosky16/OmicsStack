name: R Tests

on:
  push:
    branches:
      - main
    paths:
      - 'server.R'
      - 'ui.R'
      - 'global.R'
      - 'tests/**'
      - 'scripts/packages.R'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'server.R'
      - 'ui.R'
      - 'global.R'
      - 'tests/**'
      - 'scripts/packages.R'

jobs:
  testthat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install test dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: testthat, dplyr, pwrss
          install-pandoc: false

      - name: Parse-check app sources
        run: Rscript -e "invisible(parse('server.R')); invisible(parse('ui.R')); invisible(parse('global.R')); cat('parse OK\n')"

      - name: JS syntax gate (inline script blocks)
        run: Rscript scripts/check_js.R

      - name: Run testthat suite
        run: Rscript -e "testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE)"
