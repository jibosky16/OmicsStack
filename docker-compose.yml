services:
  shiny-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omicsstack-shiny
    ports:
      - "3838:3838"
    environment:
      - PRELOAD_ANNOTATION_DBS=TRUE
      - SHINY_SERVER=TRUE
      - R_PROFILE_USER=/etc/R/Rprofile.site
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      # Mount data directory for persistent storage
      - ./data:/srv/shiny-server/omics/data
      # Mount logs directory
      - shiny-logs:/var/log/shiny-server
      # Mount bookmarks for session persistence
      - shiny-bookmarks:/var/lib/shiny-server/bookmarks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3838/OmicsStack/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - omics-network
    # Resource limits (adjust based on your server capacity)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

volumes:
  shiny-logs:
    driver: local
  shiny-bookmarks:
    driver: local

networks:
  omics-network:
    driver: bridge
